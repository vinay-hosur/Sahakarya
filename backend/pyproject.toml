[project]
name = "sahakarya-backend"
version = "0.1.0"
description = "SAHAKARYA API and orchestration service"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15,<2",
  "cryptography>=44,<48",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx2>=2.16,<3",
  "mcp>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.8,<3",
  "pypdf>=7.2.0",
  "python-multipart>=0.0.34",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/v1/*.py" = ["B008"]
