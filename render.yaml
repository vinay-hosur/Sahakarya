services:
  - type: web
    name: sahakarya-api
    runtime: docker
    region: ohio
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "15"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
