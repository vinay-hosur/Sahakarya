services:
  - type: web
    name: sahakarya-api
    runtime: docker
    region: ohio
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "15"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      - key: FILE_STORAGE_ENDPOINT
        sync: false
      - key: FILE_STORAGE_BUCKET
        sync: false
      - key: FILE_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: FILE_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: INVITATION_FROM_EMAIL
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_MODEL
        value: "@cf/google/gemma-4-26b-a4b-it"
      - key: PUBLIC_APP_URL
        value: https://sahakarya.pages.dev
      - key: PUBLIC_API_URL
        value: https://sahakarya-api.onrender.com
