services:
  db:
    image: postgres:17-alpine
    container_name: sahakarya-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sahakarya}
      POSTGRES_USER: ${POSTGRES_USER:-sahakarya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sahakarya}
    ports:
      - "5432:5432"
    volumes:
      - sahakarya_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahakarya -d sahakarya"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sahakarya}:${POSTGRES_PASSWORD:-sahakarya}@db:5432/${POSTGRES_DB:-sahakarya}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-3}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      DEFAULT_REASONING_PROVIDER: ${DEFAULT_REASONING_PROVIDER:-}
      REASONING_CONNECT_TIMEOUT_SECONDS: ${REASONING_CONNECT_TIMEOUT_SECONDS:-10}
      REASONING_READ_TIMEOUT_SECONDS: ${REASONING_READ_TIMEOUT_SECONDS:-60}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI:-}
      SLACK_FRONTEND_URL: ${SLACK_FRONTEND_URL:-http://localhost:8080}
      SLACK_USER_SCOPES: ${SLACK_USER_SCOPES:-search:read.public,search:read.private,search:read.mpim,search:read.im,channels:history,groups:history,mpim:history,im:history}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  sahakarya_postgres_data:
